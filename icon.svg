<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0c0c0e" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGradient)" stroke-width="4" opacity="0.3" />
  
  <!-- Glow Effect -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGradient)" opacity="0.15" filter="blur(20px)" />

  <!-- Spiritual Lotus / Flame Emblem -->
  <g transform="translate(256, 256) scale(2.8)">
    <!-- Outer Petals / Radiating lines -->
    <path fill="url(#goldGradient)" d="M0,-55 C8,-25 24,-15 45,-15 C24,-5 16,15 16,40 C16,15 8,0 -16,0 C8,-5 0,-25 0,-55 Z" />
    <path fill="url(#goldGradient)" opacity="0.75" d="M0,-35 C5,-18 15,-10 28,-10 C15,-3 10,10 10,26 C10,10 5,0 -10,0 C5,-3 0,-18 0,-35 Z" />
    <circle cx="0" cy="50" r="4" fill="#FBBF24" />
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
</svg>
